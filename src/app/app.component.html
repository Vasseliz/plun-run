<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <h1>Planejador de Treinos de Corrida</h1>
      <p class="header-subtitle">
        Planejamento inteligente com IA - Registre seus treinos e receba um plano personalizado
      </p>
    </div>
  </header>

  <main class="app-main">
    <section class="section-form">
      <app-formulario-treino
        [trainings]="trainings"
        [goal]="goal"
        (trainingsChange)="trainings = $event"
        (goalChange)="onGoalChange($event)"
        (generatePlan)="onGeneratePlan()"
        (resetForm)="onResetForm()"
      ></app-formulario-treino>
    </section>

    <section class="section-list">
      <app-lista-treino
        [trainings]="trainings"
      ></app-lista-treino>
    </section>

    <section class="section-result">
      <app-resultado-treino
        [planoTreino]="planoTreino"
        [loading]="loading"
        [error]="error"
        (downloadPdf)="onDownloadPdf()"
        (newPlan)="onNewPlan()"
      ></app-resultado-treino>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <p class="footer-credits">Desenvolvido com carinho por Nícolas Vasseli</p>
      <p class="footer-warning">
        ⚠️ Este é um planejador automatizado. Consulte sempre um profissional de educação física.
      </p>
    </div>
  </footer>
</div>
